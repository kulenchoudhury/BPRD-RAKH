<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030306">

  <title>Event Updates | Barpeta Road Rash Mandir</title>
  <link rel="shortcut icon" href="RashWeb/favicon.png" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ================================
       RESET & VARIABLES
    ================================= */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --gold: #d8b46a;
      --gold-light: #f3d99b;
      --text: #f5f1e8;
      --muted: #a9a5ad;
      --bg: #030306;
      --border: rgba(255, 255, 255, 0.10);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;

      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(155, 111, 35, 0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(98, 66, 150, 0.07),
          transparent 32%
        ),
        var(--bg);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -1;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.12;
    }

    body::before {
      width: 360px;
      height: 360px;
      top: -180px;
      left: -150px;
      background: #9b722f;
      animation: ambientGlow 10s ease-in-out infinite alternate;
    }

    body::after {
      width: 360px;
      height: 360px;
      right: -160px;
      bottom: -190px;
      background: #5d397c;
      animation: ambientGlow 12s ease-in-out infinite alternate-reverse;
    }

    @keyframes ambientGlow {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(25px, 20px, 0) scale(1.08);
      }
    }


    /* ================================
       PARTICLES
    ================================= */

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--gold-light);
      opacity: 0;
      box-shadow: 0 0 8px rgba(243, 217, 155, 0.6);
      animation: rise 9s linear infinite;
    }

    .particle:nth-child(1) { left: 8%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 21%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 35%; animation-delay: 5s; }
    .particle:nth-child(4) { left: 51%; animation-delay: 1s; }
    .particle:nth-child(5) { left: 66%; animation-delay: 4s; }
    .particle:nth-child(6) { left: 81%; animation-delay: 6s; }
    .particle:nth-child(7) { left: 93%; animation-delay: 3s; }

    @keyframes rise {
      0% {
        transform: translate3d(0, 0, 0);
        opacity: 0;
      }
      15% {
        opacity: 0.5;
      }
      80% {
        opacity: 0.25;
      }
      100% {
        transform: translate3d(35px, -110vh, 0);
        opacity: 0;
      }
    }


    /* ================================
       MAIN WRAPPER & CARD
    ================================= */

    .wrapper {
      width: min(92%, 740px);
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 32px 0;
      animation: pageAppear 0.9s ease-out both;
    }

    @keyframes pageAppear {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      position: relative;
      width: 100%;
      padding: 54px 40px 42px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.018)
        );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(216, 180, 106, 0.07);
      filter: blur(60px);
      pointer-events: none;
    }


    /* ================================
       LOGO & TYPOGRAPHY
    ================================= */

    .logo {
      position: relative;
      z-index: 1;
      display: block;
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 0 16px rgba(216, 180, 106, 0.25));
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      margin-bottom: 18px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    .status {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 24px;
      padding: 9px 16px;
      border: 1px solid rgba(216, 180, 106, 0.18);
      border-radius: 999px;
      background: rgba(216, 180, 106, 0.05);
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px rgba(216, 180, 106, 0.7);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    h1 {
      position: relative;
      z-index: 1;
      margin-bottom: 16px;
      font-family: "Cinzel", serif;
      font-size: clamp(30px, 5.5vw, 52px);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(110deg, #ffffff, var(--gold-light), #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textShine 6s linear infinite;
    }

    @keyframes textShine {
      to { background-position: 200% center; }
    }

    .description {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.8;
    }


    /* ================================
       EVENT GALLERY
    ================================= */

    .event-gallery {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin: 0 auto 32px;
      max-width: 600px;
    }

    .event-image-link {
      display: block;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid rgba(216, 180, 106, 0.22);
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .event-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 11;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.03);
    }

    .event-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .event-image-link:hover {
      transform: translateY(-4px);
      border-color: rgba(216, 180, 106, 0.6);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 20px rgba(216, 180, 106, 0.15);
    }

    .event-image-link:hover .event-image-wrapper img {
      transform: scale(1.07);
    }

    .image-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(3, 3, 6, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--gold-light);
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .event-image-link:hover .image-tag {
      background: rgba(155, 111, 35, 0.3);
      border-color: rgba(216, 180, 106, 0.35);
    }

    .image-tag svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }


    /* ================================
       IMAGE MODAL / LIGHTBOX
    ================================= */

    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(3, 3, 6, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .image-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-container {
      position: relative;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.92);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .image-modal.active .modal-container {
      transform: scale(1);
    }

    /* Close Icon Button */
    .modal-close-btn {
      position: absolute;
      top: -18px;
      right: -18px;
      z-index: 10;
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid rgba(216, 180, 106, 0.4);
      background: #111118;
      color: var(--gold-light);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .modal-close-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }

    .modal-close-btn:hover {
      transform: rotate(90deg) scale(1.08);
      background: var(--gold);
      color: #030306;
      border-color: var(--gold-light);
    }

    .modal-close-btn:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }

    .modal-image-holder {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(216, 180, 106, 0.35);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(216, 180, 106, 0.12);
      background: #09090f;
    }

    .modal-image-holder img {
      max-width: 100%;
      max-height: 75vh;
      display: block;
      object-fit: contain;
    }

    .modal-caption {
      margin-top: 14px;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-align: center;
    }


    /* ================================
       DIVIDER & BUTTON
    ================================= */

    .divider {
      width: 80px;
      height: 1px;
      margin: 10px auto 30px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .back-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 13px 24px;
      border: 1px solid rgba(216, 180, 106, 0.30);
      border-radius: 13px;
      background:
        linear-gradient(
          135deg,
          rgba(216, 180, 106, 0.15),
          rgba(216, 180, 106, 0.04)
        );
      color: #f5e6bd;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .back-button svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      transition: transform 0.25s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(
          135deg,
          rgba(216, 180, 106, 0.23),
          rgba(216, 180, 106, 0.08)
        );
      border-color: rgba(216, 180, 106, 0.55);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 20px rgba(216, 180, 106, 0.07);
    }

    .back-button:hover svg {
      transform: translateX(-3px);
    }

    .back-button:active {
      transform: translateY(0);
    }

    .back-button:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 4px;
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      color: rgba(255, 255, 255, 0.32);
      font-size: 10px;
      letter-spacing: 0.4px;
    }


    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 650px) {
      .card {
        padding: 42px 20px 34px;
        border-radius: 22px;
      }

      .event-gallery {
        grid-template-columns: 1fr;
        gap: 15px;
        max-width: 320px;
        margin-bottom: 26px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }

      h1 {
        font-size: clamp(28px, 8vw, 36px);
      }

      .description {
        font-size: 13px;
        margin-bottom: 24px;
      }

      .back-button {
        width: 100%;
        max-width: 280px;
      }

      .modal-close-btn {
        top: -12px;
        right: -10px;
        width: 38px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- Decorative particles -->
  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>

  <main class="wrapper">

    <section class="card">

      <!-- Logo -->
      <img
        src="RashWeb/favicon.png"
        alt="Barpeta Road Rash Mandir Logo"
        class="logo"
      >

      <div class="eyebrow">
        Barpeta Road Rash Mahotsav
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Event Page Updates
      </div>

      <h1>
        Events & Highlights
      </h1>

      <p class="description">
        Stay tuned as we prepare full event schedules, rituals, and celebration updates. Click below to preview event captures and posters.
      </p>

      <!-- 2 EVENT IMAGES WITH LINKS -->
      <div class="event-gallery">

        <!-- Image 1 -->
        <a 
          href="RashWeb/Zublee.jpg" 
          class="event-image-link open-lightbox" 
          data-caption="Barpeta Road Rash Mahotsav"
          aria-label="View"
        >
          <div class="event-image-wrapper">
            <img src="RashWeb/Zublee.jpg" alt="Barpeta Road Rash Mahotsav" loading="lazy">
          </div>
          <div class="image-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            </svg>
            <span>View</span>
          </div>
        </a>

        <!-- Image 2 -->
        <a 
          href="RashWeb/Sadhana.jpg" 
          class="event-image-link open-lightbox" 
          data-caption="Barpeta Road Rash Mahotsav"
          aria-label="View"
        >
          <div class="event-image-wrapper">
            <img src="RashWeb/Sadhana.jpg" alt="Barpeta Road Rash Mahotsav" loading="lazy">
          </div>
          <div class="image-tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            </svg>
            <span>View</span>
          </div>
        </a>

      </div>

      <div class="divider"></div>

      <!-- Back Button -->
      <a href="index.html" class="back-button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Back to Home
      </a>

      <div class="footer">
        © 2026 Barpeta Road Rash Mahotsav
      </div>

    </section>

  </main>


  <!-- ================================
       FULLSCREEN LIGHTBOX MODAL WITH CLOSE ICON
  ================================= -->
  <div class="image-modal" id="imageModal" role="dialog" aria-modal="true" aria-label="Expanded Event Image Preview">
    <div class="modal-container">
      
      <!-- Close Button with X Icon -->
      <button type="button" class="modal-close-btn" id="closeModalBtn" aria-label="Close image preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="modal-image-holder">
        <img src="" alt="Expanded Event Photo" id="modalImg">
      </div>

      <div class="modal-caption" id="modalCaption"></div>

    </div>
  </div>


  <!-- ================================
       LIGHTBOX SCRIPT
  ================================= -->
  <script>
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImg');
    const modalCaption = document.getElementById('modalCaption');
    const closeBtn = document.getElementById('closeModalBtn');
    const imageLinks = document.querySelectorAll('.open-lightbox');

    // Open Modal function
    function openLightbox(url, captionText) {
      modalImg.src = url;
      modalCaption.textContent = captionText || '';
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Stop background scrolling
      closeBtn.focus();
    }

    // Close Modal function
    function closeLightbox() {
      modal.classList.remove('active');
      modalImg.src = '';
      document.body.style.overflow = ''; // Restore scrolling
    }

    // Attach click listeners to image cards
    imageLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const imageUrl = link.getAttribute('href');
        const caption = link.getAttribute('data-caption');
        openLightbox(imageUrl, caption);
      });
    });

    // Close on click of Close (X) button
    closeBtn.addEventListener('click', closeLightbox);

    // Close on click anywhere outside the image
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeLightbox();
      }
    });

    // Close on Escape key press
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeLightbox();
      }
    });
  </script>

</body>
</html>
